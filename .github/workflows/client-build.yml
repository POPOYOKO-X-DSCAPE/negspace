name: client-build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Panda CSS
        run: bun run codegen

      - name: Typecheck (needs the generated styled-system)
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare secrets not configured — skipping pages deploy"
            exit 0
          fi
          # Project create is best-effort: the token may not carry the
          # project-management permission — a missing project is a
          # clear deploy error below.
          bun x wrangler pages project create negspace --production-branch main || true
          # Custom domain (neg.space) is a one-time attach — no API call here:
          # attach it once from the CF dashboard (Pages → project → Custom
          # domains); deploys then serve it automatically.
          bun x wrangler pages deploy dist --project-name=negspace

      - name: Publish versioned release (sources + dist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r ".version" package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version missing in package.json" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git config user.name "client-build[bot]"
          git config user.email "client-build@users.noreply.github.com"
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          zip -qr "sources-${TAG}.zip" . -x "node_modules/*" "dist/*" "styled-system/*" ".git/*"
          ( cd dist && zip -qr "../dist-${TAG}.zip" . )
          gh release create "$TAG" --title "Sources ${TAG}" --notes "Auto-published from main (sources + dist)." "sources-${TAG}.zip" "dist-${TAG}.zip"
