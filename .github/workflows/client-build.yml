name: client-build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Panda CSS
        run: bun run codegen

      - name: Typecheck (needs the generated styled-system)
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Publish dist to gh-pages
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          git config --global user.name "client-build[bot]"
          git config --global user.email "client-build@users.noreply.github.com"
          git clone --depth 1 --branch main "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMP"
          git -C "$TMP" checkout --orphan gh-pages
          git -C "$TMP" rm -rf . 2>/dev/null || true
          cp -r dist/. "$TMP"/
          git -C "$TMP" add -A
          git -C "$TMP" commit -m "🚀 dist (main ${GITHUB_SHA:0:7})" --allow-empty
          git -C "$TMP" push -f origin HEAD:gh-pages
          rm -rf "$TMP"

      - name: Publish versioned release (sources + dist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r ".version" package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version missing in package.json" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git config user.name "client-build[bot]"
          git config user.email "client-build@users.noreply.github.com"
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          zip -qr "sources-${TAG}.zip" . -x "node_modules/*" "dist/*" "styled-system/*" ".git/*"
          ( cd dist && zip -qr "../dist-${TAG}.zip" . )
          gh release create "$TAG" --title "Sources ${TAG}" --notes "Auto-published from main (sources + dist)." --verify false "sources-${TAG}.zip" "dist-${TAG}.zip"
